# Supabase configuration for PETORA
# This is a draft configuration file

project_id = "petora"

[api]
enabled_api_endpoints = ["auth", "rest", "graphql"]
port = 54321

[db]
port = 54322

[studio]
port = 54323

[auth]
enabled_providers = ["email", "google"]

[functions.auth-signin]
verify_jwt = false

[functions.auth-signup]
verify_jwt = false

[functions.customers-list]
verify_jwt = true

[functions.products-list]
verify_jwt = true

[functions.inventory-locations]
verify_jwt = true

[functions.sales-list]
verify_jwt = true

[realtime]
enabled = true